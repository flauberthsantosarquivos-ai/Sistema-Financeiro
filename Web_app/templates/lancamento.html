<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <title>BASE_LANCAMENTOS</title>

    <style>
        :root {
            --bg: #f4f6fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --primary: #1d4ed8;
            --green: #047857;
            --red: #b91c1c;
            --amber: #b45309;
            --border: #e5e7eb;
            --shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .page {
            max-width: 1600px;
            margin: 0 auto;
            padding: 32px;
        }

        .hero {
            background: linear-gradient(135deg, #0f172a, #1d4ed8);
            color: white;
            border-radius: 26px;
            padding: 32px;
            box-shadow: var(--shadow);
            margin-bottom: 22px;
        }

        .hero h1 {
            margin: 0 0 8px;
            font-size: 32px;
            letter-spacing: -0.04em;
        }

        .hero p {
            margin: 0;
            color: #dbeafe;
        }

        .nav {
            display: flex;
            gap: 12px;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }

        .nav a {
            text-decoration: none;
            background: white;
            border: 1px solid var(--border);
            color: #1e40af;
            padding: 12px 16px;
            border-radius: 999px;
            font-weight: 800;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.05);
        }

        .nav a.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 22px;
            box-shadow: var(--shadow);
            padding: 24px;
            margin-bottom: 24px;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 12px;
            align-items: end;
        }

        label {
            font-size: 12px;
            font-weight: 900;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            display: block;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 13px;
            padding: 12px;
            background: #f9fafb;
            font-size: 15px;
            font-family: inherit;
        }

        input[type="checkbox"] {
            width: auto;
            transform: scale(1.15);
            cursor: pointer;
        }

        button {
            border: none;
            background: var(--primary);
            color: white;
            border-radius: 13px;
            padding: 13px 20px;
            font-weight: 900;
            cursor: pointer;
            white-space: nowrap;
        }

        .clear-link {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            background: #e5e7eb;
            color: #111827;
            border-radius: 13px;
            padding: 13px 20px;
            font-weight: 900;
            white-space: nowrap;
            width: 100%;
        }

        .clear-link:hover {
            background: #d1d5db;
        }

        .trash-button {
            background: #dc2626;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .trash-button:hover {
            background: #b91c1c;
        }

        .alert {
            padding: 15px 18px;
            border-radius: 16px;
            margin-bottom: 18px;
            font-weight: 700;
        }

        .success {
            background: #ecfdf5;
            border: 1px solid #bbf7d0;
            color: #065f46;
        }

        .error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px;
            margin-bottom: 24px;
        }

        .metric {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 22px;
            box-shadow: var(--shadow);
            padding: 20px;
        }

        .metric-title {
            font-size: 12px;
            color: var(--muted);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 10px;
        }

        .metric-value {
            font-size: 25px;
            font-weight: 950;
            letter-spacing: -0.04em;
        }

        .green {
            color: var(--green);
        }

        .red {
            color: var(--red);
        }

        .amber {
            color: var(--amber);
        }

        .table-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 14px;
        }

        .table-actions-left {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            color: #334155;
            font-weight: 800;
        }

        .selection-hint {
            color: var(--muted);
            font-size: 13px;
            font-weight: 700;
        }

        .table-wrap {
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: 18px;
        }

        table {
            width: 100%;
            min-width: 1650px;
            border-collapse: collapse;
        }

        th {
            background: #f8fafc;
            color: #334155;
            text-align: left;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            vertical-align: top;
        }

        .select-col {
            text-align: center;
            width: 70px;
        }

        .money {
            text-align: right;
            font-weight: 900;
            white-space: nowrap;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            padding: 5px 10px;
            border-radius: 999px;
            background: #f1f5f9;
            color: #334155;
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
        }

        .desc {
            min-width: 280px;
            font-weight: 700;
        }

        .edit-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #eff6ff;
            color: #1d4ed8;
            border: 1px solid #bfdbfe;
            border-radius: 999px;
            padding: 6px 10px;
            text-decoration: none;
            font-weight: 900;
            font-size: 12px;
        }

        .edit-link:hover {
            background: #dbeafe;
        }

        @media (max-width: 1200px) {
            .filter-grid,
            .summary {
                grid-template-columns: 1fr;
            }

            .page {
                padding: 18px;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <section class="hero">
            <h1>Dashboard Financeiro</h1>
            <p>
                BASE_LANCAMENTOS: consulta, filtros, edição e exclusão da base oficial do sistema.
            </p>
        </section>

        <nav class="nav">
            <a href="/">Início</a>
            <a href="/financeiro">Visão Geral</a>
            <a href="/financeiro/base-lancamentos" class="active">BASE_LANCAMENTOS</a>
